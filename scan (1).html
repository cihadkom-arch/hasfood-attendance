<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Attendance Check-in</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #8a8f9e;
    --accent: #4f8ef7;
    --success: #22c97a;
    --danger: #f05a5a;
    --warning: #f5a623;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .logo { font-size: 13px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; margin-bottom: 32px; }

  .avatar {
    width: 80px; height: 80px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 600;
    margin: 0 auto 20px;
  }

  .emp-name { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .emp-id { font-size: 13px; color: var(--muted); margin-bottom: 32px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 99px;
    font-size: 14px; font-weight: 500; margin-bottom: 32px;
  }
  .status-pill.in  { background: rgba(79,142,247,0.15); color: var(--accent); }
  .status-pill.out { background: rgba(34,201,122,0.15); color: var(--success); }
  .status-pill.done{ background: rgba(245,166,35,0.15); color: var(--warning); }

  .time-display { font-size: 48px; font-weight: 700; letter-spacing: -2px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .date-display { font-size: 14px; color: var(--muted); margin-bottom: 36px; }

  .btn {
    width: 100%; padding: 18px; border-radius: 14px;
    font-size: 18px; font-weight: 600; border: none; cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.97); }
  .btn-checkin  { background: var(--accent); color: #fff; }
  .btn-checkout { background: var(--success); color: #fff; }
  .btn-disabled { background: var(--border); color: var(--muted); cursor: default; }

  .already-done {
    font-size: 15px; color: var(--muted); line-height: 1.6;
    padding: 20px; border: 1px solid var(--border); border-radius: 14px;
  }

  .summary { margin-top: 20px; font-size: 14px; color: var(--muted); line-height: 1.8; }
  .summary span { color: var(--text); font-weight: 500; }

  .loading { font-size: 15px; color: var(--muted); }
  .dot-anim::after { content: '...'; animation: dots 1.2s infinite; }
  @keyframes dots { 0%,20%{content:'.'} 40%,60%{content:'..'} 80%,100%{content:'...'} }

  .error-state { color: var(--danger); font-size: 15px; line-height: 1.6; }
  .error-icon { font-size: 48px; margin-bottom: 16px; }

  .success-flash { animation: flash 0.4s ease; }
  @keyframes flash { 0%{opacity:0;transform:scale(0.95)} 100%{opacity:1;transform:scale(1)} }

  .footer { margin-top: 24px; font-size: 12px; color: var(--muted); opacity: 0.5; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="logo">Attendance System</div>
  <div class="loading dot-anim" id="state-loading">Loading</div>
</div>

<div class="footer">Scan your QR code on arrival and departure</div>

<script>
const SUPABASE_URL = 'https://jfvjtutflvowhekxllnm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_us3E-IgY_UWiXhP6QtoqLg_FIBL_qR_';

const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const params = new URLSearchParams(window.location.search);
const empId = (params.get('id') || '').toUpperCase();

function today() { return new Date().toISOString().slice(0, 10); }
function timeNow() { return new Date().toTimeString().slice(0, 5); }
function formatTime(t) { if (!t) return '—'; return t.slice(0,5); }

function initials(name) {
  const p = name.trim().split(' ');
  return p.length === 1 ? p[0].slice(0,2).toUpperCase() : (p[0][0] + p[p.length-1][0]).toUpperCase();
}

async function api(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let clockInterval;
function startClock() {
  const update = () => {
    const now = new Date();
    const el = document.getElementById('live-clock');
    if (el) el.textContent = now.toTimeString().slice(0,5);
  };
  update();
  clockInterval = setInterval(update, 1000);
}

function renderError(msg) {
  document.getElementById('card').innerHTML = `
    <div class="logo">Attendance System</div>
    <div class="error-icon">⚠️</div>
    <div class="error-state">${msg}</div>
  `;
}

function renderEmployee(emp, record) {
  const card = document.getElementById('card');
  const statusLabel = record
    ? (record.status === 'present' ? 'Checked in' : 'Checked out')
    : 'Not checked in yet';
  const statusClass = record
    ? (record.status === 'present' ? 'in' : 'done')
    : 'out';

  let actionHTML = '';
  if (!record) {
    actionHTML = `<button class="btn btn-checkin" onclick="doCheckIn()">Check in now</button>`;
  } else if (record.status === 'present') {
    actionHTML = `<button class="btn btn-checkout" onclick="doCheckOut()">Check out now</button>
    <div class="summary">Checked in at <span>${formatTime(record.check_in)}</span></div>`;
  } else {
    const hrs = record.hours ? parseFloat(record.hours).toFixed(1) + 'h worked' : '';
    actionHTML = `<div class="already-done">
      You're done for today ✓<br>
      <span style="color:#f0f0f0;font-weight:500;">${hrs}</span>
    </div>
    <div class="summary">In: <span>${formatTime(record.check_in)}</span> &nbsp;·&nbsp; Out: <span>${formatTime(record.check_out)}</span></div>`;
  }

  card.innerHTML = `
    <div class="logo">Attendance System</div>
    <div class="avatar" style="background:${emp.color}33;color:${emp.color};">${initials(emp.name)}</div>
    <div class="emp-name">${emp.name}</div>
    <div class="emp-id">${emp.id}</div>
    <div class="status-pill ${statusClass}">${statusLabel}</div>
    <div class="time-display" id="live-clock">--:--</div>
    <div class="date-display">${new Date().toLocaleDateString('en-BE', { weekday:'long', day:'numeric', month:'long' })}</div>
    ${actionHTML}
  `;
  card.classList.add('success-flash');
  startClock();
}

async function doCheckIn() {
  const btn = document.querySelector('.btn-checkin');
  if (btn) { btn.textContent = 'Registering...'; btn.disabled = true; }
  try {
    await api('POST', 'attendance', {
      emp_id: empId, date: today(), status: 'present',
      check_in: timeNow(), check_out: null, hours: null
    });
    await load();
  } catch(e) { renderError('Could not register. Please try again.'); }
}

async function doCheckOut() {
  const btn = document.querySelector('.btn-checkout');
  if (btn) { btn.textContent = 'Registering...'; btn.disabled = true; }
  try {
    const rec = await api('GET', `attendance?emp_id=eq.${empId}&date=eq.${today()}&select=*`);
    if (!rec || !rec[0]) { renderError('No check-in record found.'); return; }
    const r = rec[0];
    const inParts = r.check_in.slice(0,5).split(':').map(Number);
    const outParts = timeNow().split(':').map(Number);
    const mins = (outParts[0]*60+outParts[1]) - (inParts[0]*60+inParts[1]);
    const hours = (mins / 60).toFixed(2);
    await api('PATCH', `attendance?id=eq.${r.id}`, {
      status: 'checkedout', check_out: timeNow(), hours: parseFloat(hours)
    });
    await load();
  } catch(e) { renderError('Could not register. Please try again.'); }
}

async function load() {
  if (!empId) { renderError('No employee ID in this QR code.<br>Please contact your manager.'); return; }
  try {
    const emps = await api('GET', `employees?id=eq.${empId}&select=*`);
    if (!emps || !emps.length) { renderError(`Employee <strong>${empId}</strong> not found.<br>Contact your manager.`); return; }
    const emp = emps[0];
    const records = await api('GET', `attendance?emp_id=eq.${empId}&date=eq.${today()}&select=*`);
    const record = records && records.length ? records[0] : null;
    renderEmployee(emp, record);
  } catch(e) { renderError('Connection error. Check your internet and try again.'); }
}

load();
</script>
</body>
</html>
